; Copy to config.ini (or just run setup_pairing.py, which writes it for you).
; config.ini is gitignored -- it holds your device address, pairing code and
; MQTT credentials, none of which belong in the repo.

[device]
; Bluetooth address of your Powerpal
address = AA:BB:CC:DD:EE:FF
; the 6-digit pairing code shown in the Powerpal app -- also used as the BLE
; SMP passkey during pairing
pairing_code = 000000
; meter constant: pulses per kWh (check the sticker on your meter, often
; printed as "imp/kWh"); 1000 is the common default
pulses_per_kwh = 1000

[mqtt]
host = 127.0.0.1
port = 1883
; leave blank if your broker has no auth
username = homeassistant
password = changeme
; must match the discovery prefix Home Assistant's MQTT integration expects
discovery_prefix = homeassistant

[state]
; where the persisted lifetime energy total (kWh) is stored
file = ~/.local/state/powerpal-daemon/energy_wh.json
